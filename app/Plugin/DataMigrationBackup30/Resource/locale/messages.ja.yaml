      step2: ステップ1で移行元バージョンを選択し「バックアップファイルあり」を選択
      step3: 今ダウンロードした .tar.gz をアップロード
      step4: ステップ2 / ステップ3で実行モードを選び移行を開始
      step5: 移行前に「移行バックアップ > 事前診断」で移行先バックアップファイルをアップロードすると、移行可否（OK/要確認/不可）とエラー内容を確認できます。
      assets_note: 関連ファイルは移行先の既存ディレクトリへ上書き配置してください。
